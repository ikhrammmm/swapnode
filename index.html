<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWAP NODE Tracker</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 10px; background: #f4f4f9; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; position: relative; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        label { font-size: 0.8rem; color: #666; display: block; }
        select, input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        button { cursor: pointer; padding: 10px 15px; border: none; border-radius: 4px; font-weight: bold; }
        .btn-scan { background: #007bff; color: white; margin-top: 5px; }
        .btn-add { background: #28a745; color: white; width: 100%; font-size: 1rem; }
        .btn-copy { background: #17a2b8; color: white; margin-right: 10px; }
        .btn-clear { background: #dc3545; color: white; }
        #reader { width: 100%; max-width: 400px; margin: 0 auto; display: none; }
        .node-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; margin-bottom: 10px; }
        .delete-node { color: #dc3545; font-size: 0.8rem; background: none; border: 1px solid; }
    </style>
</head>
<body>

    <h2>SWAP NODE Tool</h2>
    <div id="nodes-container"></div>

    <button class="btn-add" onclick="addNode()">+ Add New Swap Node</button>
    <hr>
    
    <div style="margin-top: 20px;">
        <button class="btn-copy" onclick="copyToClipboard()">Copy All Information</button>
        <button class="btn-clear" onclick="clearData()">Clear All</button>
    </div>

    <div id="scanner-ui" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:100; text-align:center; padding-top:50px;">
        <div id="reader" style="display:block; background:white;"></div>
        <button onclick="stopScanner()" style="margin-top:20px; padding:15px 30px;">Cancel</button>
    </div>

<script>
    let nodeCount = 0;
    let currentTargetInput = null;
    const html5QrCode = new Html5Qrcode("reader");

    // Initialize with one node
    window.onload = () => addNode();

    function addNode() {
        nodeCount++;
        const container = document.getElementById('nodes-container');
        const html = `
            <div class="card" id="node-${nodeCount}">
                <div class="node-header">
                    <strong>Node #${nodeCount}</strong>
                    <button class="delete-node" onclick="removeNode(${nodeCount})">Remove</button>
                </div>
                
                <label>Backup SN</label>
                <input type="text" id="backup-sn-${nodeCount}" placeholder="Scan or type SN">
                <button class="btn-scan" onclick="startScanner('backup-sn-${nodeCount}')">📷 Scan Backup</button>

                <div class="grid">${getLocationFields('backup', nodeCount)}</div>
                
                <hr>

                <label>Faulty SN</label>
                <input type="text" id="faulty-sn-${nodeCount}" placeholder="Scan or type SN">
                <button class="btn-scan" onclick="startScanner('faulty-sn-${nodeCount}')">📷 Scan Faulty</button>

                <div class="grid">${getLocationFields('faulty', nodeCount)}</div>
            </div>
        `;
        container.insertAdjacentHTML('beforeend', html);
    }

    function getLocationFields(type, id) {
        return `
            <div>
                <label>Data Hall</label>
                <select id="${type}-dh-${id}">
                    ${Array.from({length: 10}, (_, i) => `<option value="V1.${i+1}">V1.${i+1}</option>`).join('')}
                </select>
            </div>
            <div>
                <label>Row</label>
                <select id="${type}-row-${id}">
                    ${['A','B','C','D','E','F'].map(r => `<option value="${r}">${r}</option>`).join('')}
                </select>
            </div>
            <div>
                <label>Rack No</label>
                <select id="${type}-rack-${id}">
                    ${Array.from({length: 15}, (_, i) => `<option value="${(i+1).toString().padStart(2,'0')}">${(i+1).toString().padStart(2,'0')}</option>`).join('')}
                </select>
            </div>
            <div>
                <label>U Number</label>
                <select id="${type}-u-${id}">
                    ${Array.from({length: 40}, (_, i) => `<option value="${i+1}">${i+1}</option>`).join('')}
                </select>
            </div>
        `;
    }

    function removeNode(id) {
        document.getElementById(`node-${id}`).remove();
    }

    function startScanner(inputId) {
        currentTargetInput = inputId;
        document.getElementById('scanner-ui').style.display = 'block';
        html5QrCode.start(
            { facingMode: "environment" }, 
            { fps: 10, qrbox: { width: 250, height: 150 } },
            (decodedText) => {
                document.getElementById(currentTargetInput).value = decodedText;
                stopScanner();
            }
        ).catch(err => alert("Camera error: " + err));
    }

    function stopScanner() {
        html5QrCode.stop().then(() => {
            document.getElementById('scanner-ui').style.display = 'none';
        });
    }

    function formatLoc(type, id) {
        const dh = document.getElementById(`${type}-dh-${id}`).value;
        const row = document.getElementById(`${type}-row-${id}`).value;
        const rack = document.getElementById(`${type}-rack-${id}`).value;
        const u = document.getElementById(`${type}-u-${id}`).value;
        // Example: V1-1.OS30 A01/U11
        const formattedDh = dh.replace('.', '-');
        return `${formattedDh}.OS30 ${row}${rack}/U${u}`;
    }

    function copyToClipboard() {
        const today = new Date().toLocaleDateString('en-GB');
        let output = `SWAP NODE\nDATE : ${today}\n\n`;
        
        const nodes = document.querySelectorAll('.card');
        nodes.forEach((node) => {
            const id = node.id.split('-')[1];
            output += `Backup SN : ${document.getElementById(`backup-sn-${id}`).value}\n`;
            output += `Location : ${formatLoc('backup', id)}\n`;
            output += `Faulty SN : ${document.getElementById(`faulty-sn-${id}`).value}\n`;
            output += `Location : ${formatLoc('faulty', id)}\n\n`;
        });

        navigator.clipboard.writeText(output.trim()).then(() => {
            alert("Information copied to clipboard!");
        });
    }

    function clearData() {
        if(confirm("Are you sure you want to clear all data?")) {
            document.getElementById('nodes-container').innerHTML = '';
            nodeCount = 0;
            addNode();
        }
    }
</script>
</body>
</html>
